[package]
name = "tuitube"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "time", "macros", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# start_paused = true でプロセス kill の猶予待ちを実時間で待たないため。
tokio = { version = "1", features = ["test-util"] }
